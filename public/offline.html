<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0C">
  <title>لا يوجد اتصال | BURGER HOUSE</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0A0A0C;color:#F6F3EC;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(100%,420px);padding:32px 24px;border:1px solid #ffffff1a;border-radius:20px;background:#141417}
    .mark{width:64px;height:64px;object-fit:contain;margin-bottom:18px}h1{font-size:22px;margin:0 0 12px}p{color:#b8b4ac;line-height:1.8;font-size:14px;margin:0 0 22px}
    button{border:0;border-radius:12px;background:#F2B705;color:#0A0A0C;padding:13px 22px;font-weight:800;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/brand-mark.svg" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذر تحميل الصفحة. تأكد من اتصال الجهاز بالإنترنت، ثم أعد المحاولة. لن يتم تحويلك إلى واجهة العملاء بدل لوحة الإدارة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
